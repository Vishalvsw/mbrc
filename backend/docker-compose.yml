version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mbrc
    ports: ["5432:5432"]
    volumes: [mbrc_pg_data:/var/lib/postgresql/data]
volumes:
  mbrc_pg_data:
